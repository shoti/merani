name: CI

on:
  push:
    branches: ["main", "shoti/merani-v1-stability-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python modules
        run: python -m compileall -q skills/merani/scripts

      - name: Enforce architecture boundaries
        run: python skills/merani/scripts/check_architecture.py

      - name: Validate JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          for file in skills/merani/scripts/fixtures/*.json; do
            python -m json.tool "$file" >/dev/null
          done

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python skills/merani/scripts/test_merani.py

      - name: Verify nested test discovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s skills/merani/scripts/tests
          -t skills/merani/scripts
